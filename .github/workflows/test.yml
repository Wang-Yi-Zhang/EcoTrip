name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 核心計算與行程檢查
        run: node docs/tests/core.test.mjs
      - name: Apps Script 模擬測試與允許值單一來源
        run: node docs/tests/gas.test.mjs
      - name: 黃金檔（沙巴行程結果不得改變）
        run: node docs/tests/golden.test.mjs
      - name: 對照旅行與專有字樣
        run: node docs/tests/contrast.test.mjs
      - name: P0費用範圍與資料一致性
        run: node docs/tests/p0.test.mjs
      - name: 匯率存檔規則（只保留使用者自訂的匯率）
        run: node docs/tests/fx-state.test.mjs
      - name: 對照旅行可以產生網頁
        run: node tools/build-trip.mjs docs/tests/fixtures/contrast-trip.json /tmp/contrast.html
      - name: 首頁與各行程網頁是最新的
        run: node tools/build-site.mjs --check
