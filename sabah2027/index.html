<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 沙巴雨林生態探索規劃系統｜Tabin × Danum Valley</title>
<meta name="description" content="2027/01/28–02/06 沙巴 Tabin Wildlife Reserve 與 Danum Valley 10 天 9 夜生態觀察旅行的行程檢查、費用試算、物種與風險決策工具。">
<meta name="theme-color" content="#1E2922">
<!-- Leaflet：僅「生態地圖」需要；載入失敗時其他模組照常運作。SRI 已於 2026-11-10 實際下載核對。 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
/* ===== 設計變數：婆羅洲雨林探險儀表板 ===== */
:root{
  --forest:#1E2922; --forest-2:#26352C; --forest-3:#31443A; --line:#3E5247;
  --amber:#D97706; --amber-soft:#F2B45A; --mud:#2D2B2A; --mud-2:#3A3735;
  --warm:#F5F0E6; --muted:#BDB6A9; --dim:#9C968B;
  --alert:#F0643C; --alert-bg:#3B1F17; --ok:#5DBB82; --info:#7DB3E0; --demo:#C49BE8;
  --radius:12px; --gap:14px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--forest);color:var(--warm);line-height:1.6;font-size:16px;
  background-image:radial-gradient(circle at 12% -10%,rgba(217,119,6,.10),transparent 40%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px);
  padding-bottom:calc(70px + env(safe-area-inset-bottom))}
a{color:var(--amber-soft)}
a:hover{color:#FFD08A}
:focus-visible{outline:3px solid var(--amber-soft);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.skip{position:absolute;left:-999px;top:0;background:var(--amber);color:#111;padding:8px 12px;z-index:2000}
.skip:focus{left:8px;top:8px}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em}
h1{font-size:1.15rem} h2{font-size:1.3rem} h3{font-size:1.05rem} h4{font-size:.95rem;color:var(--muted)}
p{margin:.3em 0 .7em}
small,.small{font-size:.82rem}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ===== Header ===== */
.topbar{position:sticky;top:0;z-index:1000;background:rgba(30,41,34,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1240px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.brand svg{flex:none}
.brand small{display:block;color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;background:var(--forest-2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.local .dot{background:var(--info)} .pill.remote .dot{background:var(--ok)} .pill.err .dot{background:var(--alert)} .pill.loading .dot{background:var(--amber)}

/* ===== Navigation (desktop top tabs / mobile bottom bar) ===== */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px;white-space:nowrap;font-size:.95rem}
.tab[aria-selected="true"]{color:var(--warm);border-bottom-color:var(--amber);font-weight:700}
.tab .en{font-size:.72rem;display:block;color:var(--dim);font-weight:400}
.desk-nav{max-width:1240px;margin:0 auto;padding:0 8px;display:none}
.mob-nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:#18211B;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.mob-nav .tabs{justify-content:space-between}
.mob-nav .tab{flex:1;padding:8px 2px 6px;border-bottom:0;border-top:3px solid transparent;font-size:.8rem;min-width:46px}
.mob-nav .tab[aria-selected="true"]{border-top-color:var(--amber)}
.mob-nav .tab .ico{display:block;font-size:1.1rem;line-height:1.1}
@media (min-width:900px){ .desk-nav{display:block} .mob-nav{display:none} body{padding-bottom:20px} }

/* ===== Layout ===== */
main{max-width:1240px;margin:0 auto;padding:16px 14px 30px}
section[role="tabpanel"]{display:none} section[role="tabpanel"].active{display:block}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:1fr} .g3{grid-template-columns:1fr} .g4{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){ .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }
@media (min-width:1050px){ .g3{grid-template-columns:repeat(3,1fr)} }
.split{display:grid;gap:var(--gap);grid-template-columns:1fr}
.grid>*,.split>*{min-width:0} /* 防止表格撐開 grid 欄位造成手機版水平溢出 */
@media (min-width:960px){ .split{grid-template-columns:320px 1fr} .split.wide-left{grid-template-columns:380px 1fr} }
.card{background:var(--forest-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card.mud{background:var(--mud);border-color:#4A4643}
.card.alert{background:var(--alert-bg);border-color:var(--alert)}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.section-head p{margin:0}
.kpi .label{font-size:.82rem;color:var(--muted)}
.kpi .value{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0}
.kpi .value.amber{color:var(--amber-soft)}
.kpi .sub{font-size:.8rem;color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.scroll-x{overflow-x:auto}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.6}
.b-confirmed{color:#9BE3B5;border-color:#3F8A5D;background:#173225}
.b-quoted{color:#A9D1F2;border-color:#4C7DA6;background:#16283A}
.b-public_rate{color:#A9E0E0;border-color:#4A9494;background:#123030}
.b-third_party{color:#A9E0E0;border-color:#4A9494;background:#123030;border-style:dashed}
.b-planned{color:#D7E3B0;border-color:#7B8A4A;background:#262D17}
.b-estimate{color:#F7C97E;border-color:#A86A12;background:#33240D}
.b-suggested{color:#F7C97E;border-color:#A86A12;background:#33240D}
.b-tbc{color:#FFB39C;border-color:var(--alert);background:var(--alert-bg)}
.b-demo{color:#E2C8F7;border-color:#8A63AD;background:#2B1F38;border-style:dashed}
.b-unquoted{color:#D0CBC2;border-color:#77716A;background:repeating-linear-gradient(45deg,#2F2D2B 0 4px,#3A3735 4px 8px)}
.b-user{color:#E9E4DA;border-color:#8E887E;background:#3A3735}
.b-live{color:#9BE3B5;border-color:#3F8A5D;background:#173225}
.b-cache{color:#A9D1F2;border-color:#4C7DA6;background:#16283A}
.b-stale{color:#F7C97E;border-color:#A86A12;background:#33240D}
.b-error{color:#FFB39C;border-color:var(--alert);background:var(--alert-bg)}
.b-idle{color:#D0CBC2;border-color:#77716A;background:#2F2D2B}
.iucn{font-family:var(--mono);font-weight:800;padding:0 6px;border-radius:4px;font-size:.78rem}
.iucn-CR{background:#B3261E;color:#fff}.iucn-EN{background:#D2591F;color:#fff}.iucn-VU{background:#C9A227;color:#1a1a1a}
.iucn-NT{background:#6E8B3D;color:#fff}.iucn-LC{background:#3C6E4F;color:#fff}.iucn-DD,.iucn-NE,.iucn-null{background:#5E5A55;color:#fff}

/* ===== Forms ===== */
label{font-size:.88rem;color:var(--muted);display:block;margin-bottom:3px}
input[type=number],input[type=text],input[type=url],input[type=search],select,textarea{background:#16201A;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
textarea{min-height:64px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=checkbox],input[type=radio]{accent-color:var(--amber);width:18px;height:18px;vertical-align:middle}
.field{min-width:0}
.check{display:flex;gap:8px;align-items:flex-start;color:var(--warm);font-size:.95rem;margin:0;padding:6px 0}
.check input{margin-top:3px;flex:none}
.btn{background:var(--forest-3);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:42px;color:var(--warm)}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1208;font-weight:700}
.btn.primary:hover{background:#E8890F}
.btn.small{min-height:34px;padding:4px 10px;font-size:.85rem}
.btn.ghost{background:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:8px 14px;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1A1208;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--forest-3);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:34px;color:var(--warm)}
.chip[aria-pressed="true"]{background:#4A3510;border-color:var(--amber);color:#FFE0B0}
.chip.sp{font-size:.8rem;padding:2px 10px;min-height:28px}

/* ===== Alerts / checks ===== */
.msg{border-left:4px solid var(--muted);background:var(--mud);padding:8px 12px;border-radius:6px;font-size:.92rem}
.msg+.msg{margin-top:6px}
.msg.error{border-color:var(--alert);background:var(--alert-bg)}
.msg.warn{border-color:var(--amber)}
.msg.info{border-color:var(--info)}
.msg.ok{border-color:var(--ok)}
.msg b{margin-right:4px}

/* ===== Itinerary ===== */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.daybtn{flex:none;background:var(--forest-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:left;min-width:84px;color:var(--warm)}
.daybtn[aria-pressed="true"]{border-color:var(--amber);background:#3A2B10}
.daybtn .d{font-weight:800}.daybtn .w{font-size:.75rem;color:var(--muted)}
.daybtn .r{display:block;font-size:.72rem;margin-top:2px}
.region-c0{color:#9BD3A8}.region-c1{color:#8FC6E8}.region-c2{color:#E8C48F}.region-c3{color:#E2C8F7}.region-c4{color:#F7C97E}.region-c5{color:#A9E0E0}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:8px}
.timeline>li{position:relative;padding:0 0 12px 18px}
.timeline>li::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--forest);border:2px solid var(--amber)}
details.act{background:var(--forest-2);border:1px solid var(--line);border-radius:10px}
details.act>summary{list-style:none;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer}
details.act>summary::-webkit-details-marker{display:none}
details.act>summary::after{content:"▸";margin-left:auto;color:var(--dim)}
details.act[open]>summary::after{content:"▾"}
details.act .body{padding:0 12px 12px;border-top:1px dashed var(--line)}
.slot{font-size:.75rem;color:var(--dim);min-width:3.2em}
.effort{letter-spacing:2px;color:var(--amber-soft);font-size:.8rem}
.lodge{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--mud);border-radius:10px;padding:10px 12px}
.lodge .arrow{color:var(--amber)}
.tag{font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.tag.need{border-color:#8A6A2E;color:#F2CC8A}

/* ===== Budget ===== */
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.82rem;white-space:nowrap}
tbody th{white-space:normal}
td.r,th.r{text-align:right}
tr.sub td{background:var(--mud);font-weight:700}
tr.off td{opacity:.5}
.bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:#16201A;border:1px solid var(--line)}
.bar>span{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.big-total{font-size:2rem;font-weight:900;color:var(--amber-soft);font-variant-numeric:tabular-nums;line-height:1.1}
.unq{color:#D0CBC2;font-style:italic}

/* ===== Map ===== */
#map{height:60vh;min-height:380px;border-radius:var(--radius);border:1px solid var(--line);background:#16201A}
.leaflet-container{font-family:var(--font)}
.leaflet-popup-content{margin:10px 12px;font-size:.88rem;line-height:1.5;color:#1d1d1d}
.leaflet-popup-content h4{color:#1E2922;margin:0 0 4px;font-size:1rem}
.leaflet-popup-content .badge{color:#1E2922;background:#eee;border-color:#999}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin-top:6px}
/* 手機：地圖在上、地點資訊卡在地圖下方、清單最後；桌面：清單在左、地圖在右 */
.map-split>.map-col{order:-1}
@media (min-width:960px){ .map-split>.map-col{order:0} }
@media (max-width:899px){ #map{height:46vh;min-height:280px} .leaflet-control-attribution{font-size:.62rem;line-height:1.3;max-width:calc(100vw - 60px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .leaflet-touch .leaflet-bar a{width:40px;height:40px;line-height:40px} }
#map{position:relative;z-index:0} /* 自成堆疊層：縮放鈕與圖層鈕不會蓋到固定在上方的頁首 */
#poi-detail{margin-top:10px}
#poi-detail h4{color:var(--warm);font-size:1.05rem;margin:0 0 4px}
#poi-detail .poi-body>div{margin-top:4px}
.poi-approx{color:#B3261E;font-weight:700} #poi-detail .poi-approx{color:#FFB39C}
.poi-coord{font-size:.75rem;color:#555;margin-top:4px} #poi-detail .poi-coord{color:var(--dim)}
.leaflet-popup-content .poi-day{color:#1E2922;background:#eee;border-color:#999}
.poi-day{margin:2px}

/* ===== Wildlife ===== */
.sp-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.sp-card{background:var(--forest-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;color:var(--warm)}
.sp-card:hover{border-color:var(--amber)}
.sp-photo{aspect-ratio:4/3;background:#16201A;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.8rem;position:relative;overflow:hidden}
.sp-photo img{width:100%;height:100%;object-fit:cover;display:block}
.sp-photo .credit{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#ddd;font-size:.62rem;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.sci{font-style:italic;color:var(--muted);font-size:.85rem}
.star{background:transparent;border:1px solid var(--line);border-radius:8px;min-height:34px;padding:2px 10px;color:var(--warm)}
.star[aria-pressed="true"]{border-color:var(--amber);color:var(--amber-soft)}
.obs-label{font-size:.8rem;border-radius:6px;padding:4px 8px;background:var(--mud)}
dialog{background:var(--forest-2);color:var(--warm);border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{position:sticky;top:0;background:var(--forest-2);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
.dlg-body{padding:14px 16px}
.kv{display:grid;grid-template-columns:minmax(90px,30%) 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* ===== Compare ===== */
.cmp th{width:26%}
.score{font-family:var(--mono);font-weight:800}
.weights .field{margin-bottom:8px}

/* ===== Print ===== */
#print-view{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  .topbar,.mob-nav,main,dialog,.skip{display:none!important}
  #print-view{display:block}
  #print-view h1{font-size:16pt} #print-view h2{font-size:13pt;margin-top:14pt}
  #print-view table{font-size:9pt} #print-view th,#print-view td{border-bottom:1px solid #999;color:#000}
  #print-view .badge{border:1px solid #333;color:#000;background:none}
  #print-view tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<!-- =====================================================================
     內建資料（Mock / 本機資料）。邏輯上的 6+1 個 JSON 資料集。

<script type="application/json" id="data-trip">
{
 "id": "sabah2027",
 "title": "2027 沙巴雨林生態探索：Tabin × Danum Valley",

    const rooms = q.rooms_from ? ctx[q.rooms_from] : ctx.rooms;
    switch (item.unit) {
      case "per_person": return { qty: ctx.pax, text: `${ctx.pax} 人` };
      case "per_group": return { qty: 1, text: "1 團" };
      case "per_group_per_day": return { qty: days, text: `${days} 天` };
      case "per_person_per_night": return { qty: ctx.pax * nights, text: `${ctx.pax} 人 × ${nights} 晚` };
      case "per_room_per_night": return { qty: rooms * nights, text: `${rooms} 房 × ${nights} 晚` };
      case "per_person_trip": return { qty: ctx.pax * trips, text: `${ctx.pax} 人 × ${trips} 趟` };
      case "per_person_day": return { qty: ctx.pax * days, text: `${ctx.pax} 人 × ${days} 天` };
      case "per_room": return { qty: rooms, text: `${rooms} 房` };
      default: return { qty: null, text: "計價單位未知" };
    }
  }

  function unitPrice(item, s) {
    const ov = s.overrides && s.overrides[item.id];
    if (isNum(ov)) return { price: ov, status: "user" };
    const p = item.price;
    if (item.status === "unquoted" || p == null) return { price: null, status: "unquoted" };
    if (isNum(p)) return { price: p, status: item.status };
    const v = p[s.scenario || "mid"];
    return { price: isNum(v) ? v : null, status: isNum(v) ? item.status : "unquoted" };
  }

  /**
   * 計算預算。回傳所有明細行與彙總；未報價的項目 amount = null，不會變成 0。
   * @param {object} data   內建或遠端資料 {costs, itinerary, ...}
   * @param {object} state  使用者設定
   * @param {object} patch  臨時覆寫（例如比較不同方案、低中高情境）
   */
  function computeBudget(data, state, patch) {
    const s = Object.assign({}, state, patch || {});
    const fx = isNum(Number(s.fx)) && Number(s.fx) > 0 ? Number(s.fx) : null;
    const money = currencyOf(data), catLabels = categoryLabels(data);
    const rateOf = cur => { const r = Number(s.rates && s.rates[cur]); return isNum(r) && r > 0 ? r : null; };   // 1 外幣 = ? 本位幣
    const ctx = computeCtx(data, s);
    const lines = [];
    for (const item of data.costs.items) {
      const active = itemActive(item, s, ctx, data);
      const { qty, text } = itemQuantity(item, ctx);
      const { price, status } = unitPrice(item, s);
      const cur = item.price_currency || money.base;
      const raw = price == null || qty == null ? null : price * qty;
      const bad = raw != null && !isNum(raw);           // 計價參數錯誤（例如缺 qty 欄位）→ 不計入，不顯示 NaN
      let amt = bad ? null : raw;
      let inBase = null, inHome = null;
      if (amt != null) {
        if (cur === money.base) { inBase = amt; inHome = fx ? amt * fx : null; }
        else if (cur === money.home) { inHome = amt; inBase = fx ? amt / fx : null; }
        else { const r = rateOf(cur); inBase = r ? amt * r : null; inHome = inBase != null && fx ? inBase * fx : null; }
      }
      lines.push({ id: item.id, name: item.name, category: item.category, unit: item.unit,
        unitLabel: UNIT_LABEL[item.unit] || item.unit, currency: cur, unitPrice: price, qty, qtyText: text,
        amountBase: inBase, amountHome: inHome, status, baseStatus: item.status, active,
        fixed: FIXED_UNITS.has(item.unit), source_ids: item.source_ids || [], includes: item.includes || [],
        excludes: item.excludes || [], assumption: item.assumption || "", notes: item.notes || "", paramError: bad,
        duplicate_risk: item.duplicate_risk || [], optional: item.applies === "optional" });
    }
    const act = lines.filter(l => l.active);
    const priced = act.filter(l => l.amountBase != null);
    const sum = arr => arr.reduce((a, l) => a + l.amountBase, 0);
    const subtotal = sum(priced);
    const pct = isNum(Number(s.contingencyPct)) ? Math.max(0, Number(s.contingencyPct)) : 0;
    const contingency = subtotal * pct / 100;
    const total = subtotal + contingency;
    const byCategory = {};
    for (const k of Object.keys(catLabels)) byCategory[k] = { base: sum(priced.filter(l => l.category === k)), unpriced: act.filter(l => l.category === k && l.amountBase == null).length };
    const quoted = sum(priced.filter(l => ["quoted", "confirmed"].includes(l.status)));
    const pub = sum(priced.filter(l => l.status === "public_rate" || l.status === "third_party"));
    const firm = quoted + pub;
    const soft = sum(priced.filter(l => ["estimate", "demo"].includes(l.status)));
    const user = sum(priced.filter(l => l.status === "user"));
    const unpriced = act.filter(l => l.amountBase == null);
    const warnings = [];
    if (ctx.pax < 1) warnings.push({ level: "error", msg: "人數至少需 1 人。" });
    for (const r of (data.trip.pax_rules || [])) if (ctx.pax < r.below) warnings.push({ level: r.level || "warn", msg: r.msg });
    if (ctx.rooms < 1) warnings.push({ level: "error", msg: "房間數至少需 1 間。" });
    if (ctx.rooms > ctx.pax && ctx.pax > 0) warnings.push({ level: "error", msg: `房間數（${ctx.rooms}）多於人數（${ctx.pax}），會出現空房。` });
    if (ctx.singles > 0) warnings.push({ level: "warn", msg: `有 ${ctx.singles} 間為單人入住：報價以兩人同房為準，單人房差額尚未報價，未計入。` });
    if (ctx.triples > 0) warnings.push({ level: "warn", msg: `每房超過 2 人（多出 ${ctx.triples} 人）：需向業者確認是否可三人房及加床費。` });
    if (money.home && !fx) warnings.push({ level: "error", msg: `匯率無效，無法換算 ${money.home}。` });
    for (const cur of new Set(act.map(l => l.currency))) if (cur !== money.base && cur !== money.home && !rateOf(cur)) warnings.push({ level: "error", msg: `${cur} 匯率無效，${cur} 計價項目無法換算。` });
    const activeIds = new Set(act.map(l => l.id)), seenPairs = new Set();
    for (const l of act) for (const d of l.duplicate_risk) {
      if (!activeIds.has(d) || d === l.id) continue;
      const key = [l.id, d].sort().join("|"); if (seenPairs.has(key)) continue; seenPairs.add(key);
      const other = lines.find(x => x.id === d);
      warnings.push({ level: "warn", code: "duplicate", msg: `可能重複計費：「${l.name}」與「${other.name}」內容可能重疊，請向業者確認（試算仍依報價計入）。` });
    }
    for (const l of act) if (l.status === "user" && l.unitPrice === 0) warnings.push({ level: "info", msg: `「${l.name}」使用者輸入單價為 0：請確認確實免費或已含於套裝。` });
    for (const l of lines) if (l.paramError) warnings.push({ level: "error", msg: `「${l.name}」計價參數錯誤（數量無法計算），未計入總計。` });
    return { ctx, lines, subtotal, contingencyPct: pct, contingency, total, fx, currency: money, categoryLabels: catLabels,
      totalHome: fx ? total * fx : null, perPerson: ctx.pax ? total / ctx.pax : null,
      perPersonHome: fx && ctx.pax ? total * fx / ctx.pax : null,
      fixed: sum(priced.filter(l => l.fixed)), variable: sum(priced.filter(l => !l.fixed)),
      byCategory, unpriced, warnings,
      completeness: { firm, quoted, pub, soft, user, firmShare: subtotal ? firm / subtotal : null,
        quotedShare: subtotal ? quoted / subtotal : null, pubShare: subtotal ? pub / subtotal : null,
        softShare: subtotal ? soft / subtotal : null, userShare: subtotal ? user / subtotal : null,
        unpricedCount: unpriced.length, activeCount: act.length } };
  }

  /** 比較某個選擇題的各選項：每個選項各算一次預算；categoryTotal 為該選擇題對應費用分類（compare_category）的小計 */
  function compareChoice(data, state, choiceId) {
    const def = choiceDef(data, choiceId); if (!def) return null;
    const sumOrNull = arr => arr.some(l => l.amountBase == null) ? null : arr.reduce((a, l) => a + l.amountBase, 0);
    const options = {};
    for (const o of def.options) {
      const budget = computeBudget(data, state, { choices: Object.assign({}, state.choices, { [choiceId]: o.key }) });
      options[o.key] = { key: o.key, label: o.label || o.key, budget, categoryTotal: def.compare_category ? sumOrNull(budget.lines.filter(l => l.active && l.category === def.compare_category)) : null };
    }
    const list = Object.values(options);
    return { choice: def, options, comparable: list.every(x => x.budget.unpriced.length === list[0].budget.unpriced.length),
      allPriced: list.every(x => x.categoryTotal != null) };
  }

  function scenarios(data, state) {
    return { low: computeBudget(data, state, { scenario: "low" }), mid: computeBudget(data, state, { scenario: "mid" }), high: computeBudget(data, state, { scenario: "high" }) };
  }

  /* ---------- 行程品質檢查 ---------- */
  function checkItinerary(data, state) {
    const out = [];
    const trip = data.trip, days = data.itinerary.days;
    const expectDays = trip.nights + 1;
    if (days.length !== expectDays) out.push({ level: "error", code: "days", msg: `行程天數 ${days.length} 天，與旅行期間 ${expectDays} 天不符。` });
    days.forEach((d, i) => {
      const exp = addDaysISO(trip.start, i);
      if (d.date !== exp) out.push({ level: "error", code: "date", day: d.day, msg: `Day ${d.day} 日期為 ${d.date}，預期 ${exp}（日期缺漏或錯置）。` });
    });
    // 住宿夜數
    const regionCount = {}; let unbooked = 0, noLodging = 0;
    days.forEach((d, i) => {
      if (i === days.length - 1) return; // 返程日無住宿
      const lid = resolveLodging(d.lodging, state, data);
      if (!lid) { noLodging++; out.push({ level: "warn", code: "lodging", day: d.day, msg: `Day ${d.day}（${d.date}）當晚住宿待確認。` }); return; }
      const poi = poiById(data, lid);
      if (!poi) { out.push({ level: "error", code: "ref", day: d.day, msg: `Day ${d.day} 住宿 id「${lid}」不存在於地點資料。` }); return; }
      regionCount[poi.region] = (regionCount[poi.region] || 0) + 1;
      if (!["confirmed"].includes(d.lodging_status)) unbooked++;
    });
    for (const seg of trip.segments) {
      const n = regionCount[seg.key] || 0;
      if (n !== seg.nights) out.push({ level: "error", code: "nights", msg: `${seg.label} 排定 ${n} 晚，與套裝 ${seg.nights} 晚不符。` });
    }
    const totalNights = Object.values(regionCount).reduce((a, b) => a + b, 0);
    if (totalNights + noLodging !== trip.nights) out.push({ level: "error", code: "nights", msg: `總夜數 ${totalNights + noLodging}，應為 ${trip.nights}。` });
    if (unbooked) out.push({ level: "info", code: "unbooked", msg: `${trip.nights} 晚中有 ${unbooked + noLodging} 晚尚未取得訂房確認（報價不等於訂房）。` });
    // 轉場連續性：今晚住宿 = 明天的前一晚住宿
    for (let i = 0; i < days.length - 1; i++) {
      const tonight = resolveLodging(days[i].lodging, state, data), next = resolveLodging(days[i + 1].lodging_prev, state, data);
      if (tonight && next && tonight !== next) out.push({ level: "error", code: "continuity", day: days[i + 1].day, msg: `Day ${days[i + 1].day} 的前一晚住宿（${next}）與 Day ${days[i].day} 當晚住宿（${tonight}）不一致。` });
    }
    // 時間衝突、轉場強度、未確認
    let tbc = 0;
    for (const d of days) {
      const timed = d.activities.filter(a => toMinutes(a.start) != null && isNum(a.duration_h))
        .map(a => ({ a, s: toMinutes(a.start), e: toMinutes(a.start) + a.duration_h * 60 })).sort((x, y) => x.s - y.s);
      for (let i = 1; i < timed.length; i++) if (timed[i].s < timed[i - 1].e)
        out.push({ level: "error", code: "overlap", day: d.day, msg: `Day ${d.day}：「${timed[i - 1].a.title}」與「${timed[i].a.title}」時間重疊。` });
      const transfers = d.activities.filter(a => a.type === "transfer");
      const unknownDur = transfers.filter(a => !isNum(a.duration_h)).length;
      const hard = d.activities.filter(a => a.effort >= 3 && a.type !== "transfer");
      if (transfers.length >= 2 && hard.length) out.push({ level: "warn", code: "intensity", day: d.day, msg: `Day ${d.day} 有 ${transfers.length} 段交通，又排了高體力活動「${hard[0].title}」，建議降低強度。` });
      if (unknownDur) out.push({ level: "info", code: "duration", day: d.day, msg: `Day ${d.day} 有 ${unknownDur} 段交通時間未查證（未填寫確切時間）。` });
      for (const a of d.activities) if (activityStatus(a, state) === "tbc") tbc++;
      const hol = (trip.holidays || []).find(h => h.date === d.date);
      if (hol) out.push({ level: "warn", code: "holiday", day: d.day, msg: `Day ${d.day}（${d.date}）為${hol.name}：${hol.impact}` });
    }
    if (tbc) out.push({ level: "info", code: "tbc", msg: `共有 ${tbc} 項活動標記為「待確認」。` });
    // 與報價的交叉檢查
    const ctx = computeCtx(data, state);
    for (const it of data.costs.items) if (it.itinerary_check && optionSelected(data, state, it.itinerary_check.plan) && !itemActive(it, state, ctx, data))
      out.push({ level: "warn", code: "feasibility", day: it.itinerary_check.day, msg: it.itinerary_check.msg });
    // 報價晚數 vs 行程選擇（費用項目的 qty.nights_from = "activity_count" 且有 quoted_nights）
    for (const it of data.costs.items) {
      if (!isNum(it.quoted_nights) || !it.qty || it.qty.nights_from !== "activity_count") continue;
      const n = ctx.activityCount[it.id] || 0;
      if (n !== it.quoted_nights) out.push({ level: "warn", code: "quote", msg: `行程中選了 ${n} 晚${it.count_label || it.name}，業者報價為 ${it.quoted_nights} 晚；試算依行程選擇計算，單價沿用報價（須向業者確認）。` });
    }
    // 報價天數 vs 該區段涵蓋的日曆天（費用項目的 days_check = {segment, msg}，msg 可用 {span}、{days}）
    for (const it of data.costs.items) {
      const dc = it.days_check; if (!dc || !it.qty || !isNum(it.qty.days)) continue;
      const span = days.filter(d => d.region === dc.segment || (d.segment_days || []).includes(dc.segment)).length;
      if (span > it.qty.days) out.push({ level: "info", code: "quote", msg: String(dc.msg).replace(/\{span\}/g, span).replace(/\{days\}/g, it.qty.days) });
    }
    return out;
  }

  function lodgingNightsSummary(data, state) {
    const days = data.itinerary.days; let planned = 0, tbd = 0, booked = 0;
    for (let i = 0; i < days.length - 1; i++) {
      const lid = resolveLodging(days[i].lodging, state, data);
      if (!lid) { tbd++; continue; }
      const st = days[i].lodging_status;
      if (st === "confirmed") booked++;
      if (st === "tbc") tbd++; else planned++;
    }
    return { planned, tbd, booked, total: data.trip.nights };
  }

  /* ---------- 觀察可能性（定性標籤，非機率） ---------- */
  const OBS_LABELS = {
    strong: "有較充分歷史觀察依據", recorded: "有歷史紀錄，但不易觀察",
    rare: "罕見或高度仰賴運氣", insufficient: "資料不足，無法判斷" };
  /**
   * @param {object} rec {lit, inat_snapshot:{total,latest,checked_on}}
   * @param {number} difficulty 1–3
   * @param {object|null} live  {total, latest, fetchedAt} 即時 API 結果（若有）
   */
  /**
   * 觀察可能性定性標籤（規則公開，見 docs/01）。
   * A = 依 iNat Place 篩選的研究級筆數（座標未遮蔽者；遮蔽紀錄會被排除）
   * B = 依近似 Bounding Box 的研究級筆數（含座標遮蔽、隨機偏移的紀錄與周邊區域）
   * @param {object} rec {lit, inat_snapshot:{total}, inat_bbox_snapshot:{total}}
   * @param {number} difficulty 1–3（人工評估）
   * @param {object|null} live {place, bbox, fetchedAt} 即時查詢（若有）
   * @param {boolean} obscured 此分類群在 iNat 是否遮蔽座標
   */
  function observabilityLabel(rec, difficulty, live, obscured) {
    rec = rec || {};
    const snapA = rec.inat_snapshot || {}, snapB = rec.inat_bbox_snapshot || {};
    const liveA = live && isNum(live.place) ? live.place : null, liveB = live && isNum(live.bbox) ? live.bbox : null;
    const A = liveA != null ? liveA : (isNum(snapA.total) ? snapA.total : null);
    const B = liveB != null ? liveB : (isNum(snapB.total) ? snapB.total : null);
    const when = (isLive, snap) => isLive ? `即時查詢 ${live.fetchedAt || ""}`.trim() : `快照 ${snap.checked_on || "日期不明"}`;
    const lit = rec.lit || "unknown";
    const basis = [];
    if (A != null) basis.push(`iNat 保護區範圍（Place）研究級 ${A} 筆（${when(liveA != null, snapA)}）${obscured ? "：此物種座標被遮蔽，Place 篩選會排除多數紀錄，0 筆不代表不存在" : ""}`);
    else basis.push("無 iNat 保護區範圍筆數");
    if (B != null) basis.push(`iNat 近似範圍（含座標遮蔽、隨機偏移及周邊區域）${B} 筆（${when(liveB != null, snapB)}），僅供參考`);
    basis.push(lit === "recorded" ? "文獻／官方資料有紀錄" : lit === "not_found" ? "查核來源中未見紀錄（不代表不存在）" : "文獻紀錄未查證");
    basis.push(`觀察難度（人工評估）：${["", "低", "中", "高"][difficulty] || "未評估"}`);
    const a = A || 0, b = B || 0;
    const litStrong = lit === "recorded" && !rec.lit_weak, litWeak = lit === "recorded" && !!rec.lit_weak;
    if (litWeak) basis[basis.length - 2] = "文獻有紀錄，但屬弱證據（年代久遠、範圍不同或二手整理）" + (rec.lit_note ? "：" + rec.lit_note : "");
    else if (rec.lit_note) basis[basis.length - 2] += "：" + rec.lit_note;
    // 有效證據：保護區內公開紀錄、遮蔽物種的近似範圍紀錄、可靠文獻
    const evidence = a >= 1 || (obscured && b >= 1) || litStrong;
    let key;
    if (a >= 20 && difficulty <= 2) key = "strong";          // 只有保護區範圍內的公開紀錄才能得到「較充分」
    else if (difficulty >= 3) key = a >= 20 ? "recorded" : evidence ? "rare" : "insufficient";
    else if (evidence) key = "recorded";
    else key = "insufficient";                                // 僅周邊近似範圍或弱文獻：不足以判斷
    if (!evidence && (litWeak || b >= 1)) basis.push("僅有周邊近似範圍紀錄或弱文獻，不足以判斷");
    const uncertainty = "紀錄多寡 ≠ 容易看到。研究級紀錄不代表所有真實出現；筆數不等於個體數，也不能換算成觀察成功率；無紀錄不等於不存在；近似範圍不等於保護區邊界，遮蔽座標為隨機偏移。門檻（20 筆）與難度為本工具自訂。";
    return { key, label: OBS_LABELS[key], basis, uncertainty, A, B, usedLive: liveA != null || liveB != null };
  }

  /* ---------- 資料驗證（GAS / 匯入共用） ---------- */
  function validateDataset(name, d) {
    const e = [];
    const isObj = v => v && typeof v === "object" && !Array.isArray(v);
    if (!isObj(d)) return [`${name}：不是物件`];
    switch (name) {
      case "trip":
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d.start || "") || !/^\d{4}-\d{2}-\d{2}$/.test(d.end || "")) e.push("trip.start / trip.end 格式需為 YYYY-MM-DD");
        for (const k of ["title", "region_label"]) if (typeof d[k] !== "string") e.push(`trip.${k} 需為字串`);
        for (const k of ["default_pax", "default_fx"]) if (!isNum(d[k]) || d[k] <= 0) e.push(`trip.${k} 需為正數`);
        if (!Number.isInteger(d.nights) || d.nights < 1) e.push("trip.nights 需為正整數");
        if (!Array.isArray(d.segments)) e.push("trip.segments 需為陣列");
        break;
      case "itinerary":
        if (!Array.isArray(d.days) || !d.days.length) { e.push("itinerary.days 需為非空陣列"); break; }
        if (d.connections != null && !Array.isArray(d.connections)) e.push("itinerary.connections 需為陣列");
        d.days.forEach((x, i) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(x.date || "")) e.push(`days[${i}].date 格式錯誤`);
          if (!Number.isInteger(x.day)) e.push(`days[${i}].day 需為整數`);
          if (typeof x.region !== "string" || !x.region) e.push(`days[${i}].region 需為字串`);
          if (!Array.isArray(x.kind)) e.push(`days[${i}].kind 需為陣列`);
          for (const k of ["short", "weather_alt"]) if (typeof x[k] !== "string") e.push(`days[${i}].${k} 需為字串`);
          if (x.lodging !== null && typeof x.lodging !== "string") e.push(`days[${i}].lodging 需為字串或 null`);

          h("button", { class: "btn", type: "button", onclick: () => { update(x => { x.dataSource = "local"; }, { render: false }); App.data = App.local; App.origin = Object.fromEntries(C.DATASETS.map(k => [k, "local"])); App.remote = { status: "idle", errors: [] }; updatePill(); renderActive(); renderSettings(); } }, "改回本機資料")),
        testOut,
        h("hr"),
        h("h3", null, "匯出／匯入（反映目前設定，不是原始資料）"),
        h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: exportJSON }, "⬇ 匯出規劃 JSON"), h("button", { class: "btn", type: "button", onclick: exportCSV }, "⬇ 匯出費用 CSV"), h("button", { class: "btn", type: "button", onclick: () => { dlg.close(); doPrint(); } }, "🖨 列印／存 PDF")),
        h("div", { class: "field" }, h("label", { for: "imp" }, "匯入先前匯出的規劃 JSON"), h("input", { id: "imp", type: "file", accept: "application/json,.json", onchange: e => e.target.files[0] && importJSON(e.target.files[0], impOut) })),
        impOut,
        h("hr"),
        h("h3", null, "本機儲存"),
        h("p", { class: "small muted" }, storageOK ? "設定自動儲存在此瀏覽器的 LocalStorage（不會上傳）。" : "⚠ LocalStorage 無法寫入（可能是無痕模式或空間不足），重新整理後設定會遺失，請用匯出 JSON 備份。"),
        h("div", { class: "row" },
          h("button", { class: "btn", type: "button", onclick: () => { INat.clear(); App.live = {}; App.photos = {}; App.photosRequested = false; renderSettings(); } }, `清除 iNaturalist 快取（${INat.size()} 筆）`),
          h("button", { class: "btn", type: "button", onclick: () => { if (confirm("將清除所有設定、勾選與備註，恢復預設值。確定嗎？（建議先匯出 JSON 備份）")) { try { localStorage.removeItem(LS_KEY); } catch (e) { } App.state = defaultState(App.data); saveState(); renderActive(); renderSettings(); } } }, "恢復預設設定"))));
  }

  /* ================= 啟動 ================= */
  function init() {
    try { App.local = readEmbedded(); }
    catch (e) { document.getElementById("main").append(msg("error", "內建資料解析失敗：" + e.message)); return; }
    App.data = App.local;
    App.origin = Object.fromEntries(C.DATASETS.map(k => [k, "local"]));
    App.state = loadState(App.data);
    buildTabs();
    document.getElementById("btn-settings").addEventListener("click", () => { renderSettings(); document.getElementById("dlg-settings").showModal(); });
    const hs = location.hash.slice(1);
    selectTab(TABS.some(t => t.id === hs) ? hs : App.state.tab, false);
    updatePill();
    if (App.state.dataSource === "remote" && App.state.gasUrl) loadRemote(false);
    window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (k !== S().tab && TABS.some(t => t.id === k)) selectTab(k, false); });
    window.addEventListener("storage", e => { if (e.key === LS_KEY) { App.state = loadState(App.data); renderActive(); } });
    // 離線支援：以 http(s) 開啟時註冊 Service Worker（sw.js）；失敗不影響其他功能
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(e => console.warn("離線支援未啟用", e));
  }
  window.EcoApp = { App, INat, sanitizeState, defaultState, computeNow: () => C.computeBudget(D(), S()) };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
